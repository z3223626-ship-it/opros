<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивті сауалнама</title>
  
  <!-- Chart.js & Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; }
    .lang-switch { text-align: right; max-width: 1000px; margin: 0 auto 15px auto; }
    .lang-switch button { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #333; font-size: 1.3rem; }
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .options label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .idea-hint { display: none; background-color: #e0f2fe; color: #0369a1; padding: 12px 14px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; border-left: 4px solid #0284c7; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; }
    .btn-submit { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background: #2563eb; }
    .ideas-container { max-height: 450px; overflow-y: auto; margin-top: 15px; padding-right: 5px; display: flex; flex-direction: column; gap: 10px; }
    .idea-card { background: #f8fafc; border-left: 4px solid #10b981; padding: 12px 15px; border-radius: 6px; width: 100%; }
    .idea-card strong { display: block; color: #047857; font-size: 0.9rem; margin-bottom: 4px; }
    .idea-card p { margin: 0; color: #334155; white-space: normal !important; word-wrap: break-word !important; overflow: visible !important; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="lang-switch">
    <button onclick="setLanguage('kk')">🇰🇿 Қаз</button>
    <button onclick="setLanguage('ru')">🇷🇺 Рус</button>
  </div>

  <div class="container">
    <div class="card">
      <h2 id="poll-title">Қандай технологиялар қажет?</h2>
      <div class="options" id="options-list">
        <label><input type="radio" name="category" value="Здоровье" onchange="showHint()"> <span class="cat-text">Здоровье</span></label>
        <label><input type="radio" name="category" value="Экология" onchange="showHint()"> <span class="cat-text">Экология</span></label>
        <label><input type="radio" name="category" value="Образование" onchange="showHint()"> <span class="cat-text">Образование</span></label>
        <label><input type="radio" name="category" value="Безопасность" onchange="showHint()"> <span class="cat-text">Безопасность</span></label>
        <label><input type="radio" name="category" value="Транспорт" onchange="showHint()"> <span class="cat-text">Транспорт</span></label>
        <label><input type="radio" name="category" value="Общение" onchange="showHint()"> <span class="cat-text">Общение</span></label>
        <label><input type="radio" name="category" value="Быт и экономия времени" onchange="showHint()"> <span class="cat-text">Быт и экономия времени</span></label>
        <label><input type="radio" name="category" value="Другое" onchange="showHint()"> <span class="cat-text">Другое</span></label>
      </div>

      <div id="idea-hint" class="idea-hint">
        <strong>💡 Бағыт беретін сұрақ:</strong><br>
        <span id="hint-text">Что вы предложили бы сделать конкретно или какой аппарат придумали бы?</span>
      </div>

      <input type="text" id="user-idea" placeholder="Өз нұсқаңызды жазыңыз...">
      <button class="btn-submit" onclick="submitVote()" id="btn-text">Өз нұсқамды жіберу</button>
    </div>

    <div class="card">
      <h2 id="results-title">Сауалнама нәтижелері (Онлайн)</h2>
      <p><span id="total-text">📊 Барлық дауыстар:</span> <strong id="total-votes">0</strong></p>
      
      <div style="max-width: 320px; margin: 0 auto;">
        <canvas id="pollChart"></canvas>
      </div>

      <h2 style="margin-top: 25px;" id="ideas-title">Қатысушылардың идеялары:</h2>
      <div class="ideas-container" id="ideasContainer"></div>
    </div>
  </div>

  <!-- Firebase SDK Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot, 
      setDoc, 
      updateDoc, 
      increment, 
      collection, 
      addDoc, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDimu-9hYEmP7Gu4mKWNrsZlPFKVgoR4Kk",
      authDomain: "opros-2.firebaseapp.com",
      databaseURL: "https://opros-2-default-rtdb.firebaseio.com",
      projectId: "opros-2",
      storageBucket: "opros-2.firebasestorage.app",
      messagingSenderId: "800470443555",
      appId: "1:800470443555:web:337d26d7320d6ae684b396",
      measurementId: "G-9YRVRYKEVV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    Chart.register(ChartDataLabels);
    const categories = ['Здоровье', 'Экология', 'Образование', 'Безопасность', 'Транспорт', 'Общение', 'Быт и экономия времени', 'Другое'];
    let voteData = [0, 0, 0, 0, 0, 0, 0, 0];

    const ctx = document.getElementById('pollChart').getContext('2d');
    const pollChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: categories,
        datasets: [{
          data: voteData,
          backgroundColor: ['#ef4444', '#06b6d4', '#eab308', '#14b8a6', '#8b5cf6', '#f97316', '#84cc16', '#64748b']
        }]
      },
      options: {
        plugins: {
          legend: { position: 'bottom' },
          datalabels: {
            formatter: (value, ctx) => {
              let sum = 0;
              let dataArr = ctx.chart.data.datasets[0].data;
              dataArr.map(data => { sum += data; });
              let percentage = sum > 0 ? (value * 100 / sum).toFixed(1) + "%" : "0%";
              return value > 0 ? percentage : '';
            },
            color: '#fff',
            font: { weight: 'bold', size: 12 }
          }
        }
      }
    });

    function updateTotalVotesCount() {
      let total = voteData.reduce((a, b) => a + b, 0);
      document.getElementById('total-votes').innerText = total;
    }

    const votesDocRef = doc(db, "polls", "main_poll");
    onSnapshot(votesDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        voteData = categories.map(cat => data[cat] || 0);
        pollChart.data.datasets[0].data = voteData;
        pollChart.update();
        updateTotalVotesCount();
      } else {
        const initialVotes = {};
        categories.forEach(c => initialVotes[c] = 0);
        setDoc(votesDocRef, initialVotes);
      }
    });

    const ideasRef = collection(db, "ideas");
    const q = query(ideasRef, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('ideasContainer');
      container.innerHTML = '';
      snapshot.forEach((doc) => {
        const item = doc.data();
        const newCard = document.createElement('div');
        newCard.className = 'idea-card';
        newCard.innerHTML = `<strong>${item.category}</strong><p>${item.text}</p>`;
        container.appendChild(newCard);
      });
    });

    window.submitVote = async function() {
      const selected = document.querySelector('input[name="category"]:checked');
      const ideaText = document.getElementById('user-idea').value.trim();

      if (!selected) {
        alert('Категорияны таңдаңыз!');
        return;
      }

      const catValue = selected.value;

      try {
        await updateDoc(votesDocRef, {
          [catValue]: increment(1)
        });

        if (ideaText !== "") {
          await addDoc(collection(db, "ideas"), {
            category: catValue,
            text: ideaText,
            createdAt: new Date()
          });
          document.getElementById('user-idea').value = '';
        }
      } catch (e) {
        console.error("Қате орын алды: ", e);
      }
    };

    window.showHint = function() {
      document.getElementById('idea-hint').style.display = 'block';
    };

    window.setLanguage = function(lang) {
      if(lang === 'kk') {
        document.getElementById('poll-title').innerText = 'Заманауи адамға қандай технологиялар қажет?';
        document.getElementById('user-idea').placeholder = 'Өз нұсқаңызды немесе идеяңызды жазыңыз...';
        document.getElementById('btn-text').innerText = 'Өз нұсқамды жіберу';
        document.getElementById('results-title').innerText = 'Сауалнама нәтижелері (Онлайн)';
        document.getElementById('total-text').innerText = '📊 Барлық дауыстар:';
        document.getElementById('ideas-title').innerText = 'Қатысушылардың идеялары:';
        document.getElementById('hint-text').innerText = 'Что вы предложили бы сделать конкретно или какой аппарат придумали бы?';
      } else {
        document.getElementById('poll-title').innerText = 'Какие технологии нужны современному человеку?';
        document.getElementById('user-idea').placeholder = 'Введите ваш вариант...';
        document.getElementById('btn-text').innerText = 'Отправить свой вариант';
        document.getElementById('results-title').innerText = 'Результаты опроса (Онлайн)';
        document.getElementById('total-text').innerText = '📊 Всего голосов:';
        document.getElementById('ideas-title').innerText = 'Идеи участников:';
        document.getElementById('hint-text').innerText = 'Что вы предложили бы сделать конкретно или какой аппарат придумали бы?';
      }
    };
  </script>
</body>
</html>
