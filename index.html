<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный опрос / Интерактивті сауалнама</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .lang-switcher { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; }
    .lang-btn { background: #e0e0e0; color: #333; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: auto; margin: 0; }
    .lang-btn.active { background: #4A90E2; color: #fff; }
    .checkbox-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 12px; border-radius: 6px; background: #f8f9fa; }
    .dynamic-input { margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; }
    textarea { width: 100%; height: 60px; margin-top: 5px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #4A90E2; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 15px; }
    .idea-item { background: #f1f8ff; border-left: 4px solid #4A90E2; padding: 8px 12px; margin-bottom: 8px; border-radius: 0 6px 6px 0; }
    .idea-category { font-weight: bold; font-size: 0.85em; color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Опрос формасы -->
    <div class="card">
      <div class="lang-switcher">
        <button type="button" class="lang-btn active" onclick="setLanguage('ru')">RU</button>
        <button type="button" class="lang-btn" onclick="setLanguage('kk')">KZ</button>
      </div>
      <h2 id="mainTitle">Какие технологии нужны современному человеку?</h2>
      <form id="surveyForm">
        <div class="checkbox-group" id="categoriesContainer"></div>
        <div id="dynamicQuestions"></div>
        <button type="submit" id="submitBtn">Отправить свой вариант</button>
      </form>
    </div>

    <!-- Онлайн нәтижелер -->
    <div class="card">
      <h2 id="resultsTitle">Результаты опроса (Онлайн)</h2>
      <canvas id="resultsChart"></canvas>
      <h3 style="margin-top: 30px;" id="ideasTitle">Идеи участников:</h3>
      <div id="ideasList"><p style="color: #888;" id="loadingText">Загрузка данных...</p></div>
    </div>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const firebaseConfig = {
      apiKey: "AIzaSyB9jkUWkNaKqxD7Gk0_-dCrW32ID9igcIc",
      authDomain: "opros-app.firebaseapp.com",
      databaseURL: "https://opros-app-default-rtdb.firebaseio.com",
      projectId: "opros-app",
      storageBucket: "opros-app.firebasestorage.app",
      messagingSenderId: "1070134468672",
      appId: "1:1070134468672:web:07146858d76d2425c47fa5"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Тілдер аудармасы
    const translations = {
      ru: {
        title: "Какие технологии нужны современному человеку?",
        resultsTitle: "Результаты опроса (Онлайн)",
        ideasTitle: "Идеи участников:",
        submitBtn: "Отправить свой вариант",
        loading: "Загрузка данных...",
        noIdeas: "Пока нет предложений.",
        alertSelect: "Выберите хотя бы одно направление!",
        alertSuccess: "Ваш ответ отправлен!",
        questionPrompt: "что вы предложили бы конкретно?",
        placeholder: "Опишите вашу идею...",
        categories: ["Здоровье", "Экология", "Образование", "Безопасность", "Транспорт", "Общение", "Быт и экономия времени", "Другое"]
      },
      kk: {
        title: "Заманауи адамға қандай технологиялар қажет?",
        resultsTitle: "Сауалнама нәтижелері (Онлайн)",
        ideasTitle: "Қатысушылардың идеялары:",
        submitBtn: "Өз нұсқаңызды жіберу",
        loading: "Деректер жүктелуде...",
        noIdeas: "Әлі ұсыныстар түскен жоқ.",
        alertSelect: "Кемінде бір бағытты таңдаңыз!",
        alertSuccess: "Жауабыңыз жіберілді!",
        questionPrompt: "нақты не ұсынар едіңіз?",
        placeholder: "Идеяңызды сипаттаңыз...",
        categories: ["Денсаулық", "Экология", "Білім беру", "Қауіпсіздік", "Көлік", "Қарым-қатынас", "Тұрмыс пен уақытты үнемдеу", "Басқа"]
      }
    };

    let currentLang = 'ru';

    const ctx = document.getElementById('resultsChart').getContext('2d');
    const resultsChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: translations.ru.categories,
        datasets: [{
          data: new Array(8).fill(0),
          backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#8AC926', '#C9CBCF']
        }]
      },
      options: {
        responsive: true,
        animation: { duration: 1000, easing: 'easeOutQuart' },
        plugins: {
          legend: { position: 'bottom' },
          datalabels: {
            color: '#fff',
            font: { weight: 'bold', size: 12 },
            formatter: (value, ctx) => {
              const dataset = ctx.chart.data.datasets[0];
              const total = dataset.data.reduce((acc, curr) => acc + curr, 0);
              if (total === 0 || value === 0) return '';
              return ((value / total) * 100).toFixed(1) + '%';
            }
          }
        }
      }
    });

    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      translations[currentLang].categories.forEach((cat, index) => {
        const label = document.createElement('label');
        label.className = 'checkbox-label';
        label.innerHTML = `<input type="checkbox" value="${index}" class="category-checkbox"> <span>${cat}</span>`;
        container.appendChild(label);
      });
      bindCheckboxEvents();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const t = translations[lang];
      document.getElementById('mainTitle').innerText = t.title;
      document.getElementById('resultsTitle').innerText = t.resultsTitle;
      document.getElementById('ideasTitle').innerText = t.ideasTitle;
      document.getElementById('submitBtn').innerText = t.submitBtn;
      
      renderCategories();
      document.getElementById('dynamicQuestions').innerHTML = '';
      
      resultsChart.data.labels = t.categories;
      resultsChart.update();
      loadIdeas();
    }

    function bindCheckboxEvents() {
      document.querySelectorAll('.category-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const catIndex = e.target.value;
          const catName = translations[currentLang].categories[catIndex];
          const blockId = `question-block-${catIndex}`;

          if (e.target.checked) {
            const div = document.createElement('div');
            div.className = 'dynamic-input';
            div.id = blockId;
            div.innerHTML = `<label><b>${catName}:</b> ${translations[currentLang].questionPrompt}</label><textarea placeholder="${translations[currentLang].placeholder}" data-cat="${translations['ru'].categories[catIndex]}" data-cat-kk="${translations['kk'].categories[catIndex]}" required></textarea>`;
            document.getElementById('dynamicQuestions').appendChild(div);
          } else {
            const block = document.getElementById(blockId);
            if (block) block.remove();
          }
        });
      });
    }

    document.getElementById('surveyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const checkedBoxes = document.querySelectorAll('.category-checkbox:checked');
      if (checkedBoxes.length === 0) {
        alert(translations[currentLang].alertSelect);
        return;
      }

      checkedBoxes.forEach(box => {
        database.ref('votes/' + box.value).transaction(count => (count || 0) + 1);
      });

      const textareas = document.getElementById('dynamicQuestions').querySelectorAll('textarea');
      textareas.forEach(textarea => {
        if (textarea.value.trim() !== '') {
          database.ref('ideas').push({
            categoryRu: textarea.getAttribute('data-cat'),
            categoryKk: textarea.getAttribute('data-cat-kk'),
            text: textarea.value.trim()
          });
        }
      });

      e.target.reset();
      document.getElementById('dynamicQuestions').innerHTML = '';
      alert(translations[currentLang].alertSuccess);
    });

    database.ref('votes').on('value', snapshot => {
      const votes = snapshot.val() || {};
      const dataArray = translations.ru.categories.map((_, i) => votes[i] || 0);
      resultsChart.data.datasets[0].data = dataArray;
      resultsChart.update();
    });

    function loadIdeas() {
      database.ref('ideas').once('value', snapshot => {
        const ideasList = document.getElementById('ideasList');
        ideasList.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
          ideasList.innerHTML = `<p style="color: #888;">${translations[currentLang].noIdeas}</p>`;
          return;
        }
        Object.values(data).reverse().forEach(idea => {
          const item = document.createElement('div');
          item.className = 'idea-item';
          const catName = currentLang === 'kk' ? (idea.categoryKk || idea.category) : (idea.categoryRu || idea.category);
          item.innerHTML = `<div class="idea-category">${catName}</div><div>${idea.text}</div>`;
          ideasList.appendChild(item);
        });
      });
    }

    renderCategories();
    loadIdeas();
  </script>
</body>
</html>
